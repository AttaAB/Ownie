# Ground-truth design decisions in the multi-folder-sync change.
# Field meanings: see ../../../link-shortener/labels.yaml. Locations cite
# the code AFTER the change; each `location` must fall on lines the change
# touched (checked by `python -m evals.benchmark --check`).
#
# Provenance: written by a fresh Claude Code agent given only the feature
# request below and the project folder — no knowledge of mentor, the
# benchmark, or the labels; no design steering. Its tests passed (13/13).
#   "Support syncing several remote folders at once, each to its own local
#    folder, configured in a config file, with the folders syncing in
#    parallel. Keep it simple and get it working."
# Labels drafted by AI; priorities are suggestions until the developer
# verifies them.

project: sync-cli
change: multi-folder-sync
language: python
verified: true

decisions:
  - id: thread-per-folder-isolation
    title: Each folder syncs on its own thread, and one folder's failure doesn't stop the others
    location: sync_cli/cli.py:168-177
    also_at: [sync_cli/cli.py:199-206, sync_cli/cli.py:221]
    category: reliability
    priority: must-find
    key_point: >
      Every folder gets a thread running its own loop and schedule; a failed
      cycle or even an unexpected exception is caught, logged with the folder
      prefix, and the other folders keep going. The flip side: in scheduled
      mode a folder that's permanently broken just logs errors forever — the
      process stays up and nothing signals it. `ok` only affects the exit code
      with --once (0 only if every folder succeeded).
    answers:
      good: >
        Each folder runs in its own thread with its own loop, and errors —
        even unexpected exceptions — are caught and logged so one bad server
        can't take the others down. But when it's running on a schedule, a
        folder that keeps failing just logs errors; the process never exits
        or alerts, so you'd only notice by reading logs. The exit code only
        reflects failures with --once.
      partial: >
        The folders sync in parallel using threads.
      wrong: >
        If one folder fails, the whole sync-cli process exits so the problem
        gets noticed.

  - id: graceful-stop-between-files
    title: Ctrl+C / SIGTERM now waits for in-progress downloads; a second Ctrl+C forces exit
    location: sync_cli/cli.py:207-220
    also_at: [sync_cli/sync.py:157-160, sync_cli/cli.py:196-197, sync_cli/cli.py:204]
    category: reliability
    priority: nice-to-find
    key_point: >
      Signals only reach the main thread, so the interrupt sets a stop event
      that workers check between files — each finishes its current download
      first. This changes behaviour for single-folder use too: a large
      download can delay shutdown indefinitely (a service manager sending
      SIGTERM may escalate to SIGKILL), and a forced exit kills the daemon
      threads without running their cleanup, leaving .sync-part files behind
      — the "partial downloads are cleaned up" comment on the SIGTERM handler
      is no longer true.
    answers:
      good: >
        Ctrl+C or SIGTERM now just sets a stop flag, and each thread stops
        after the file it's downloading. So stopping can take as long as the
        biggest download, which matters if a service manager kills it after
        a timeout. If you press Ctrl+C again it exits right away, the worker
        threads are killed, and their temp .sync-part files are left behind.
      partial: >
        Ctrl+C stops all the folders.
      wrong: >
        Ctrl+C cancels the downloads immediately and deletes the partial
        files, like before.

  - id: all-or-nothing-locking
    title: If any folder is locked by another instance, the whole run exits before syncing
    location: sync_cli/cli.py:186-194
    also_at: [sync_cli/cli.py:123-132]
    category: reliability
    priority: must-find
    key_point: >
      All per-folder locks are taken up front; if one is held, it releases
      the others and exits with code 2. That prevents two processes writing
      the same folder, but one overlapping folder (e.g. shared between two
      config files, or a stuck old process) blocks every other folder in the
      config from syncing at all.
    answers:
      good: >
        It takes a lock in every destination before starting. If any one is
        already locked by another sync-cli, it gives up entirely with exit 2 —
        safe, but a single conflicting folder stops all the others in the
        config from syncing too.
      partial: >
        It uses a lock file so two copies don't sync the same folder.
      wrong: >
        It skips just the locked folder and syncs the rest.

  - id: dest-overlap-check
    title: Config destinations that are equal or nested are rejected
    location: sync_cli/cli.py:78-84
    also_at: [sync_cli/cli.py:74]
    category: correctness
    priority: must-find
    key_point: >
      Two jobs writing into the same or nested directories would overwrite
      each other's files and state/lock files; comparing realpaths (so
      symlinks don't slip through) with an os.sep prefix check (so /data/a
      doesn't match /data/ab) blocks that. It only covers folders in one
      config — two separate processes with nested destinations aren't
      detected, since each takes a lock in a different directory.
    answers:
      good: >
        It resolves each destination's real path and refuses the config if
        two are the same or one is inside the other, because both jobs would
        write into the same files. Using realpath catches symlinks, and the
        separator check avoids false matches. It only works within one config
        though — two separate processes could still nest.
      partial: >
        It checks that the destination folders are different.
      wrong: >
        Nested folders are allowed; each job only touches its own files so
        they can't conflict.

  - id: dest-relative-to-config
    title: A relative dest in the config is resolved against the config file's directory
    location: sync_cli/cli.py:61-73
    category: correctness
    priority: nice-to-find
    key_point: >
      "dest": "local/a" means next to the config file, not the working
      directory — the opposite of the single-folder form, where DEST is
      relative to where you run the command. That makes a config portable,
      but running the same relative path both ways syncs into different
      folders.
    answers:
      good: >
        Relative destinations in the config are relative to the config file,
        not to where you run the command, which is different from the
        SERVER DEST form. It keeps a config portable, but it's easy to get
        confused and end up syncing into a different folder than you expected.
      partial: >
        The config paths are converted to absolute paths.
      wrong: >
        Relative paths in the config are relative to the current working
        directory, same as on the command line.
