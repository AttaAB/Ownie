[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ownie"
version = "0.2.0"
description = "A Socratic code-comprehension evaluator for AI-generated code."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "pydantic>=2",
    "python-dotenv>=1",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/AttaAB/ownie"

[project.optional-dependencies]
eval = ["pyyaml>=6"]

[project.scripts]
ownie = "ownie.cli:main"

[tool.setuptools]
packages = ["ownie"]
